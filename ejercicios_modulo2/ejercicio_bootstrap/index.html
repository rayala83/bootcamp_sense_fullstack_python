<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Billetera</title>

</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Ingrese Email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Ingrese Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>       
    </div>
    <script>
        const form = document.getElementById('login');
        form.addEventListener('submit', event=>{
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email === 'email@email.com' && password === '12345'){
                alert('inicio de sesion exitoso')
                window.location.href = 'menu.html'
            }else{
                alert('credencales incorrectas, intente nuevamente')
            }
        });
    </script>
</body>
</html>
