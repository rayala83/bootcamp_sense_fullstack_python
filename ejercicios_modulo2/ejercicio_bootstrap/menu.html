<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu</title>

</head>
<body>
    <div class="container">
        <h2>Menú Principal</h2>

        <div class="form-group">
            <label for="balance">Dinero en Cuenta</label>
            <h3 id="saldo-cuenta">$60.000</h3>
        </div>

        <button class="btn-redirect btn btn-primary" data-url="deposit.html">Depositar</button>
        <button class="btn-redirect btn btn-primary" data-url="sendmoney.html">Enviar Dinero</button>
        <button class="btn-redirect btn btn-primary" data-url="transactions.html">Últimos Movimientos</button>
    
    </div>
    <script>
        const botonRedirect = document.querySelectorAll('.btn-redirect');
        botonRedirect.forEach(boton=>{
            boton.addEventListener('click', function(){
                const url = this.dataset.url;
                const destino = url.replace('.html','');
                alert('redirigiendo a '+ destino)
                if(url){
                    window.location.href = url;
                } 
                
            });
        });

        function cargarSaldo() {
            
            const saldoGuardado = localStorage.getItem('saldoCuenta') || 0;
            document.getElementById('saldo-cuenta').textContent = saldoGuardado;
        }

        cargarSaldo();
        window.addEventListener('storage', cargarSaldo);

    </script>

</body>
</html>
